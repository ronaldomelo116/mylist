<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!-- SEO Básico (Para buscadores como o Google) -->
  <title>Minha Lista de Tarefas</title>
  <meta name="description"
    content="Um lista virtual para você organizar suas tarefas diárias de forma simples e rápida." />
  <meta name="author" content="Seu Nome" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph (Para quando você compartilhar o link no WhatsApp, Telegram, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Minha Lista de Tarefas" />
  <meta property="og:description" content="Crie listas personalizadas e gerencie seus afazeres." />
  <meta property="og:image" content="link-de-uma-foto-do-seu-projeto.png" />
  <link rel="icon" type="image/png" href="./img/favicon.png">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <h1>Minha lista</h1>
  </header>

  <main>

    <section class="section-title">
      <h2>Adicionar nova lista</h2>
      <label for="input-title">nome da lista</label>
      <input type="text" id="input-title" name="name-list" placeholder="Digite o nome da sua lista..." />
    </section>

    <section class="input-group">
      <label for="nova-tarefa">crie sua lista</label>
      <input type="text" id="nova-tarefa" name="tarefa" required placeholder="Digite uma nova tarefa..." />
      <button type="button" id="button-add">Adicionar</button>
    </section>

    <section class="section-title">
      <button type="button" id="btn-copy" title="Copiar lista"><i class="bi bi-copy"></i></button>
      <h2 id="list-title">Minha Lista</h2>
      <span id="task-counter"></span>
    </section>

    <section class="my-list">
      <div class="container-list">

        <ul id="list-tarefas">
          <!-- Os itens (li) entrarão aqui -->
        </ul>
      </div>
    </section>
  </main>

  <dialog id="modal-delete">
    <p>Deseja excluir: <strong id="item-nome-modal"></strong>?</p>
    <div class="modal-buttons">
      <button type="button" id="btn-n" class="btn-cancel">Não</button>
      <button type="button" id="btn-y" class="btn-confirm">Sim</button>
    </div>
  </dialog>

  <dialog id="modal-edit">
    <p>Editar Item</p>
    <input type="text" id="input-edit-task" required />
    <div class="modal-buttons">
      <button type="button" id="btn-cancel-edit" class="btn-cancel">Cancelar</button>
      <button type="button" id="btn-save-edit" class="btn-confirm">Salvar</button>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>

</html>
